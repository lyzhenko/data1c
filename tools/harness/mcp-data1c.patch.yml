# Подключение MCP-сервера Data1c.Mcp к harness (плагин @deepseek-ai/dsh-mcp-client).
#
# Этот фрагмент — элемент массива из файла патча профиля:
#   %USERPROFILE%\.dsh\profiles\desktop\cordis.patch.yml   (приложение-оболочка)
#   %USERPROFILE%\.dsh\profiles\web\cordis.patch.yml       (режим dsh web)
# Вставьте его в конец файла (в web-профиле замените им пустой массив `[]`).
# После правки профиль нужно перечитать: перезапустите harness.
#
# Инструменты сервера появятся у модели как mcp__data1c__<имя>:
#   status, open, search, grep, node, neighbors, code, metadata, platform, check, reload.
#
# Путь к выгрузке здесь намеренно не указан: агент открывает нужную выгрузку
# инструментом open, поэтому одна и та же строка работает для любого проекта.
# Чтобы зафиксировать конкретную выгрузку, добавьте в args: "--dump", "<путь>".
- insert:
    - id: mcp-data1c
      name: "@deepseek-ai/dsh-mcp-client"
      config:
        serverName: data1c
        transport: stdio
        command: 'C:\Program Files\dotnet\dotnet.exe'
        args:
          - 'C:\Users\alexa\RiderProjects\Data1C\src\Data1c.Mcp\bin\Release\net10.0\Data1c.Mcp.dll'
          - '--platform'
          # Наблюдение за выгрузкой: новая выгрузка подхватывается сама, индекс
          # пересобирается в фоне. Уберите ключ, если индекс обновляется вручную.
          - '--watch'
          - '60'
        # Индекс строится при первом обращении (на выгрузке 2,9 ГБ около 100 с), дальше
        # инструменты отвечают за миллисекунды: search 63 мс, node 16 мс, metadata 1 мс,
        # grep 0,4 с. Запас по времени оставлен на первую сборку.
        toolCallTimeoutMs: 600000
        failOnStartupError: false
